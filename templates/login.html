<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172B4D">
<title>Entrar — Secretaria Geral</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
<div class="lg">
  <div class="lg-side">
    <span class="logo"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 21h18"/><path d="M5 21V10l7-5 7 5v11"/><path d="M12 5V2M10.5 3.5h3"/><path d="M10 21v-5a2 2 0 0 1 4 0v5"/></svg></span>
    <h2>Secretaria Geral</h2>
    <p>Ocorrências, membros e congregações organizados em um só lugar.</p>
  </div>
  <main class="lg-main"><div class="lg-box">
    <h1>Entrar</h1><p class="s">Acesse com o seu login e senha.</p>
    {% if msg %}<div class="alert" role="alert">{{ msg }}</div>{% endif %}
    <form method="post">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <label>Login<input name="login" autocomplete="username" autofocus required></label>
      <label>Senha<input name="senha" type="password" autocomplete="current-password" required></label>
      <button type="submit" class="p">Entrar</button>
    </form>
  </div></main>
</div>
</body></html>
